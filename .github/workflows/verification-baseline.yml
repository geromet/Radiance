name: Verification baseline

on:
  push:
    branches:
      - phase0/487-verification-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned MCVR fork basis
        uses: actions/checkout@v4
        with:
          repository: geromet/MCVR
          ref: 69c87af5c88b6f2773a483a1c21d139ceddce78e
          path: ../MCVR
          fetch-depth: 0
      - name: Record runner toolchain
        run: |
          mkdir -p build/verification
          {
            uname -a
            java -version
            ./gradlew --version
            cmake --version
            c++ --version
            git --version
          } > build/verification/runner-toolchain.txt 2>&1
      - name: Verify canonical boundary
        run: tools/verify-baseline.sh boundary
      - name: Verify negative control
        run: tools/verify-baseline.sh boundary-negative
      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-boundary-${{ github.run_id }}
          path: build/verification
          if-no-files-found: error

  combined-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned MCVR fork basis
        uses: actions/checkout@v4
        with:
          repository: geromet/MCVR
          ref: 69c87af5c88b6f2773a483a1c21d139ceddce78e
          path: ../MCVR
          fetch-depth: 0
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install deterministic Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libvulkan-dev vulkan-tools vulkan-validationlayers-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev glslang-tools
          command -v wayland-scanner
          pkg-config --modversion xkbcommon
          pkg-config --modversion xrandr
          pkg-config --modversion xinerama
          command -v glslangValidator
          glslangValidator --version | head -n 2
      - name: Record runner toolchain
        run: |
          mkdir -p build/verification
          {
            uname -a
            java -version
            ./gradlew --version
            cmake --version
            c++ --version
            git --version
            command -v wayland-scanner
            pkg-config --modversion xkbcommon
            pkg-config --modversion xrandr
            pkg-config --modversion xinerama
            command -v glslangValidator
            glslangValidator --version | head -n 2
          } > build/verification/runner-toolchain.txt 2>&1
      - name: Run combined build through developer entrypoint
        env:
          BUILD_JOBS: '2'
        run: tools/verify-baseline.sh combined-build
      - name: Upload combined-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-combined-${{ github.run_id }}
          path: build/verification
          if-no-files-found: warn
