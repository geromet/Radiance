name: Verification baseline

on:
  pull_request:
  push:
    branches:
      - phase0/487-verification-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out Radiance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check out exact MCVR basis
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/geromet/MCVR.git "$RUNNER_TEMP/MCVR"
          git -C "$RUNNER_TEMP/MCVR" checkout --detach c2c203c82f85d4b99bb0fff3d3a591986119f2c3
          test "$(git -C "$RUNNER_TEMP/MCVR" rev-parse HEAD)" = c2c203c82f85d4b99bb0fff3d3a591986119f2c3

      - name: Run positive boundary verifier
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/positive
        run: bash ./tools/verify-baseline.sh boundary

      - name: Run deliberate negative through same verifier
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/negative
        run: bash ./tools/verify-baseline.sh boundary-negative

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: warn
          retention-days: 14

  combined-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out Radiance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Java 21 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux MCVR configure prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libvulkan-dev libshaderc-dev glslang-tools libgl-dev
          command -v wayland-scanner
          wayland-scanner --version
          pkg-config --modversion xkbcommon
          pkg-config --modversion x11
          pkg-config --modversion xrandr
          pkg-config --modversion xinerama
          pkg-config --modversion xcursor
          pkg-config --modversion xi
          pkg-config --modversion vulkan
          test -f /usr/include/shaderc/shaderc.hpp
          ldconfig -p | grep -E 'libshaderc(_combined|_shared)?\.so' >/dev/null
          command -v glslangValidator
          glslangValidator --version
          test -f /usr/include/GL/gl.h
          pkg-config --modversion gl

      - name: Check out exact MCVR basis and recursive submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/geromet/MCVR.git "$RUNNER_TEMP/MCVR"
          git -C "$RUNNER_TEMP/MCVR" checkout --detach c2c203c82f85d4b99bb0fff3d3a591986119f2c3
          test "$(git -C "$RUNNER_TEMP/MCVR" rev-parse HEAD)" = c2c203c82f85d4b99bb0fff3d3a591986119f2c3
          git -C "$RUNNER_TEMP/MCVR" submodule update --init --recursive
          test -f "$RUNNER_TEMP/MCVR/extern/vulkan_headers/include/vulkan/vulkan_core.h"
          test "$(git -C "$RUNNER_TEMP/MCVR/extern/vulkan_headers" rev-parse HEAD)" = 49f1a381e2aec33ef32adf4a377b5a39ec016ec4

      - name: Record pre-build attempt basis
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/combined-build
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_OUT"
          {
            echo "radiance_head=$(git rev-parse HEAD)"
            echo "mcvr_head=$(git -C "$MCVR_ROOT" rev-parse HEAD)"
            echo "tested_sha=${GITHUB_SHA}"
            echo "base_ref=${GITHUB_BASE_REF:-none}"
            echo "head_ref=${GITHUB_HEAD_REF:-none}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            java -version 2>&1 | head -n 1 | sed 's/^/java=/'
            cmake --version | head -n 1 | sed 's/^/cmake=/'
            c++ --version | head -n 1 | sed 's/^/compiler=/'
            wayland-scanner --version 2>&1 | head -n 1 | sed 's/^/wayland_scanner=/'
            pkg-config --modversion xkbcommon | sed 's/^/xkbcommon=/'
            pkg-config --modversion x11 | sed 's/^/x11=/'
            pkg-config --modversion xrandr | sed 's/^/xrandr=/'
            pkg-config --modversion xinerama | sed 's/^/xinerama=/'
            pkg-config --modversion xcursor | sed 's/^/xcursor=/'
            pkg-config --modversion xi | sed 's/^/xi=/'
            pkg-config --modversion vulkan | sed 's/^/vulkan=/'
            dpkg-query -W -f='shaderc_package=${Version}\n' libshaderc-dev
            dpkg-query -W -f='glslang_tools_package=${Version}\n' glslang-tools
            glslangValidator --version | head -n 1 | sed 's/^/glslangValidator=/'
            dpkg-query -W -f='libgl_dev_package=${Version}\\n' libgl-dev
            pkg-config --modversion gl | sed 's/^/gl=/'
            echo "vulkan_headers_submodule=$(git -C "$MCVR_ROOT/extern/vulkan_headers" rev-parse HEAD)"
            awk '/^#define VK_HEADER_VERSION / { found=1; print "vulkan_headers_header_version="$3 } END { exit found ? 0 : 1 }' "$MCVR_ROOT/extern/vulkan_headers/include/vulkan/vulkan_core.h"
            git -C "$MCVR_ROOT" submodule status --recursive | sed 's/^/submodule=/'
          } > "$VERIFY_OUT/pre-build-basis.txt"
          sha256sum "$VERIFY_OUT/pre-build-basis.txt" > "$VERIFY_OUT/pre-build-basis.sha256"

      - name: Run clean combined build entrypoint
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/combined-build
          BUILD_JOBS: 2
        run: |
          set +e
          bash ./tools/verify-baseline.sh combined-build
          rc=$?
          {
            echo "exit_code=$rc"
            if test -f "$VERIFY_OUT/failed-phase.txt"; then
              echo "failed_phase=$(cat "$VERIFY_OUT/failed-phase.txt")"
            else
              echo "failed_phase=none-recorded"
            fi
            for log in "$VERIFY_OUT"/*.log; do
              test -f "$log" || continue
              echo "===== tail:${log##*/} ====="
              tail -n 120 "$log"
            done
          } > "$VERIFY_OUT/terminal-outcome.txt"
          exit "$rc"

      - name: Retain combined-build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combined-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification/combined-build
          if-no-files-found: warn
          retention-days: 14
