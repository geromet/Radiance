name: Gradle bootstrap integrity

on:
  pull_request:
  push:
    branches:
      - phase0/487-verification-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out Radiance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Java 21 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out exact MCVR basis
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/geromet/MCVR.git "$RUNNER_TEMP/MCVR"
          git -C "$RUNNER_TEMP/MCVR" checkout --detach c2c203c82f85d4b99bb0fff3d3a591986119f2c3
          test "$(git -C "$RUNNER_TEMP/MCVR" rev-parse HEAD)" = c2c203c82f85d4b99bb0fff3d3a591986119f2c3

      - name: Parse shared verifier
        shell: bash
        run: bash -n ./tools/verify-baseline.sh

      - name: Verify wrapper and distribution declarations
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/manifest
        run: bash ./tools/verify-baseline.sh manifest

      - name: Reject substituted wrapper JAR before launch
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/wrapper-negative
        run: bash ./tools/verify-baseline.sh wrapper-jar-negative

      - name: Reject wrong distribution checksum declaration
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/distribution-negative
        run: bash ./tools/verify-baseline.sh distribution-checksum-negative

      - name: Detect preseeded proof cache state
        shell: bash
        env:
          MCVR_ROOT: ${{ runner.temp }}/MCVR
          VERIFY_OUT: ${{ runner.temp }}/verification/cache-negative
        run: bash ./tools/verify-baseline.sh cache-preseed-negative

      - name: Retain bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-bootstrap-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: warn
          retention-days: 14
